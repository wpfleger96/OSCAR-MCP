[project]
name = "snore"
version = "0.1.0"
description = "CLI tool for analyzing and inspecting CPAP/APAP therapy data"
requires-python = ">=3.14"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "SNORE Contributors" }
]
dependencies = [
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.49",
    "alembic>=1.18.4",
    "click>=8.3.3",
    "pyedflib>=0.1.42",
    "numpy>=2.4.4",
    "scipy>=1.17.1",
    "packaging>=26.2",
    "rich>=15.0.0",
    "plotext>=5.3.2",
    "pint>=0.25.3",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
]

[project.optional-dependencies]
# Reading discontinuous EDF+D files (mask-removal sessions, ~1-2% of files)
edf-discontinuous = [
    "mne>=1.6.0",
]

[project.scripts]
snore = "snore.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=snore --cov-report=term-missing"
markers = [
    "unit: marks tests as unit tests (run in parallel)",
    "integration: marks tests as integration tests (run sequentially)",
    "completions: marks tests for shell completion functionality",
    "e2e: marks end-to-end tests that drive the real snore binary as a subprocess",
    "slow: marks tests that take significant time (>5 seconds)",
]

[tool.ruff.lint]
select = ["I", "F", "UP", "B"]  # isort, pyflakes, pyupgrade, bugbear

[tool.ruff.lint.per-file-ignores]
"src/snore/api/**" = ["B008"]  # FastAPI's Depends()/Query() in defaults is the intended pattern

[tool.ruff.lint.isort]
lines-between-types = 1

[tool.mypy]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
strict = true

[[tool.mypy.overrides]]
module = ["numpy.*", "scipy.*", "mne.*", "pyedflib.*", "plotext.*", "ureg.*"]
ignore_missing_imports = true  # Only for external libs without stubs

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disable_error_code = ["var-annotated", "type-arg", "union-attr", "assignment", "operator", "index", "attr-defined", "arg-type", "no-any-return", "call-arg"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mne>=1.6.0",
    "mypy>=2.0.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.2",
    "scipy-stubs>=1.17.1.4",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
