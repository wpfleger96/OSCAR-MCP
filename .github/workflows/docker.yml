name: Docker Publish

# Publishing is temporarily disabled while the deployment gets more local
# testing — manual runs only. To re-enable automatic publishing, restore:
#   push:
#     branches:
#       - main
#     tags:
#       - 'v*'
on:
  workflow_dispatch:

# Queue publish runs per ref so an older build can never overwrite a newer
# `latest` tag.  cancel-in-progress: false means we wait, not skip.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases image names automatically.
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{raw}}
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          # linux/amd64 only — deployment target is amd64 Proxmox LXC;
          # QEMU-emulated arm64 adds CI time for zero consumers.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
